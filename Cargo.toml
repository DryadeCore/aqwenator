[workspace]
resolver = "3"
members = ["crates/aq-kernels", "crates/aq-engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# NVIDIA cuda-rust: cuda-oxide (Rust -> PTX kernels) + shared host runtime. Pinned rev.
cuda-device = { git = "https://github.com/NVIDIA/cuda-rust.git", rev = "8f5f2a5d6" }
cuda-host = { git = "https://github.com/NVIDIA/cuda-rust.git", rev = "8f5f2a5d6" }
cuda-core = { git = "https://github.com/NVIDIA/cuda-rust.git", rev = "8f5f2a5d6" }
# Header parsing + zero-copy views only; the fast GPU loader is ours (see docs/DESIGN.md).
safetensors = "0.8"
tokenizers = { version = "=1.0.0-rc.4", default-features = false, features = ["onig"] }
libm = "0.2"
half = "2.7"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
aq-kernels = { path = "crates/aq-kernels" }

[profile.release]
debug = 1
